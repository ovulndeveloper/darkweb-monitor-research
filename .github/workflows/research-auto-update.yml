name: Continuous research refresh

on:
  schedule:
    # GitHub Actions cron is UTC. Every 6 hours = continuous research updates.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-auto-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate automation (offline tests)
        run: python3 -m unittest discover -s rsearch/automation -p 'test_*.py' -v

      - name: Refresh verified catalog metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 rsearch/automation/refresh_catalog.py

      - name: Discover new candidate tools (staged only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 rsearch/automation/discover_candidates.py

      - name: Commit and push only when research outputs changed
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add rsearch
          if ! git diff --cached --quiet; then
            git commit -m "chore(research): automated refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "No changes to commit."
          fi
