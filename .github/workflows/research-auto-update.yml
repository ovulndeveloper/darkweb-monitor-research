name: Dark Web Monitor Auto-Update

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [research_update, tool_request]

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  research-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate verified registry
        run: |
          echo "Registry validation: $(date -u)"
          python3 -m unittest discover -s rsearch/automation -p 'test_*.py' -v

      - name: Refresh verified catalog metadata
        run: python3 rsearch/automation/refresh_catalog.py

      - name: Stage new candidates for review
        run: python3 rsearch/automation/discover_candidates.py

      - name: Build 5,000+ app directory
        run: python3 apps/automation/build_apps.py

      - name: Validate generated directory
        run: |
          python3 -m unittest discover -s apps/automation -p 'test_*.py' -v
          python3 apps/automation/validate_links.py

      - name: Commit generated updates
        run: |
          git config user.name "DarkWebMonitor Bot"
          git config user.email "darkwebmonitor-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(research): automated refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:main
          fi

      - name: Run summary
        run: |
          echo "Completed: $(date -u)"
          python3 -c "import json; d=json.load(open('apps/STATUS.json')); print('Apps entries:', d['entry_count']); print('Categories:', d['category_count']); print('Types:', d['type_count'])"
