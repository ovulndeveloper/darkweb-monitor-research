name: Dark Web Monitor Auto-Update

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [research_update, tool_request]

jobs:
  research-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - checkout: {fetch-depth: 0}
      
      - name: Initialize Research Run
        run: |
          echo "🚀 Starting dark web monitor research..."
          echo "Run: $(date -u)"
          mkdir -p research/logs
          echo "ID: $(date -u +%Y%m%d-%H%M%S)" > research/logs/current-run.txt
      
      - name: Discover New Tools
        run: |
          chmod +x rsearch/automation/discover_candidates.py
          python3 rsearch/automation/discover_candidates.py --output research/logs/discovered-tools.json
          echo "Discovered: $(python3 -c "import json; d=json.load(open('research/logs/discovered-tools.json')); print(len(d) if d else 0)" 2>/dev/null || echo 0)"
      
      - name: Refresh Catalog
        run: |
          chmod +x rsearch/automation/refresh_catalog.py
          python3 rsearch/automation/refresh_catalog.py --input research/logs/discovered-tools.json
          echo "Catalog updated"
      
      - name: Review Rankings
        run: |
          echo "Reviewing rankings..."
          if [ -f research/automation_scripts.md ]; then
            echo "Checking scripts..."
          fi
      
      - name: Create Issues
        run: |
          TOOL_COUNT=$(python3 -c "import json; d=json.load(open('research/logs/discovered-tools.json')); print(len(d) if d else 0)" 2>/dev/null || echo "0")
          if [ "$TOOL_COUNT" -gt 0 ]; then
            echo "Found $TOOL_COUNT new tools - create PRs or issues"
          else
            echo "No new tools this run"
          fi
      
      - name: Commit Updates
        run: |
          git config user.name "DarkWebMonitor Bot"
          git config user.email "darkwebmonitor-bot@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore(research): automated refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin main
          else
            echo "No changes to commit"
          fi
      
      - name: Run Summary
        run: |
          echo "🏁 Research run completed: $(date -u)"
          echo "Tools discovered: ${TOOL_COUNT:-0}"
          echo "Check Actions tab for details"